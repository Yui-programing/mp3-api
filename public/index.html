<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZingMp3 API Test UI</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b1020; color: #e5e7eb; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #93c5fd; }
    input[type="text"], input[type="url"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #0f172a; color: #e5e7eb; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    pre { background: #0f172a; color: #d1d5db; padding: 12px; border-radius: 8px; overflow: auto; max-height: 50vh; }
    small { color: #9ca3af; }
    .group-title { color: #fcd34d; font-weight: 600; margin: 0 0 10px 0; font-size: 16px; }
    audio { width: 100%; margin-top: 8px; }
    .hidden { display: none; }
    #direct128 { color: #ef4444; word-break: break-all; display: block; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- 1. TÌM KIẾM BÀI HÁT RIÊNG -->
  <div class="card">
    <div class="group-title">1. Tìm kiếm Bài hát</div>
    <div class="row">
      <div>
        <label>Tên bài hát</label>
        <input id="kwSong" type="text" placeholder="ví dụ: lạc trôi, cắt đôi nỗi sầu..." />
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnSearchSong">Tìm bài hát</button>
      </div>
    </div>
  </div>

  <!-- 2. TÌM KIẾM NGHỆ SĨ RIÊNG -->
  <div class="card">
    <div class="group-title">2. Tìm kiếm Nghệ sĩ (Ca sĩ)</div>
    <div class="row">
      <div>
        <label>Tên ca sĩ (nhập tiếng Việt có dấu bình thường)</label>
        <input id="kwArtist" type="text" placeholder="ví dụ: sơn tùng, hà anh tuấn, đen vâu..." />
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnSearchArtist" style="background: #059669;">Tìm nghệ sĩ</button>
      </div>
    </div>
  </div>

  <!-- CARD PHÁT NHẠC / SONG ID -->
  <div class="card">
    <div class="group-title">Thao tác theo Song ID</div>
    <div class="row">
      <div>
        <label>Song ID</label>
        <input id="songId" type="text" placeholder="vd: ZOACFBBU" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnPlay">Phát nhạc</button>
        <button id="btnGetLink">Link Stream</button>
        <button id="btnInfoSong">Thông tin</button>
        <button id="btnLyric">Lời bài hát</button>
      </div>
    </div>
    <audio id="player" class="hidden" controls></audio>
    <a id="direct128" class="hidden" target="_blank" rel="noreferrer noopener">Link phát trực tiếp</a>
    <small id="note128" class="hidden">Chất lượng mặc định 128kbps.</small>
  </div>

  <!-- CARD BASIC CHART -->
  <div class="card">
    <div class="group-title">Bảng xếp hạng & Trang chủ</div>
    <div class="row">
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnTop100">Get Top 100</button>
        <button id="btnHome">Get Home</button>
        <button id="btnChartHome">Get Chart Home</button>
        <button id="btnNewRelease">Get New Release Chart</button>
      </div>
    </div>
  </div>

  <!-- CARD PLAYLIST -->
  <div class="card">
    <div class="group-title">Playlist</div>
    <div class="row">
      <div>
        <label>Playlist ID</label>
        <input id="playlistId" type="text" placeholder="vd: ZWZB969E" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnDetailPlaylist">Get Detail Playlist</button>
      </div>
    </div>
  </div>

  <!-- CARD ARTIST -->
  <div class="card">
    <div class="group-title">Thông tin Nghệ sĩ (Tự động điền khi bấm Tìm nghệ sĩ)</div>
    <div class="row">
      <div>
        <label>Artist alias (slug)</label>
        <input id="artistAlias" type="text" placeholder="vd: Son-Tung-M-TP" />
      </div>
      <div>
        <label>Artist ID</label>
        <input id="artistId" type="text" placeholder="vd: QNUhZaW1CnPC" />
      </div>
      <div>
        <label>Trang (Page)</label>
        <input id="artistPage" type="text" value="1" />
      </div>
      <div>
        <label>Số lượng (Count)</label>
        <input id="artistCount" type="text" value="15" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:8px;">
        <button id="btnArtist">Xem chi tiết ca sĩ</button>
        <button id="btnArtistSongs">Xem danh sách bài hát</button>
      </div>
    </div>
  </div>

  <!-- KẾT QUẢ HIỂN THỊ -->
  <div class="card">
    <label>Kết quả trả về</label>
    <pre id="out">(chưa có dữ liệu)</pre>
  </div>

  <script>
    const out = document.getElementById('out');
    const setOut = (d) => out.textContent = typeof d === 'string' ? d : JSON.stringify(d, null, 2);

    function pickSongFields(s) {
      return {
        encodeId: s?.encodeId,
        title: s?.title,
        artistsNames: s?.artistsNames,
        duration: s?.duration
      };
    }

    async function call(path, params) {
      const url = new URL(path, window.location.origin);
      if (params) Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      setOut('Loading...');
      const res = await fetch(url);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
      }
      return res.json();
    }

    // 1. TÌM KIẾM BÀI HÁT RIÊNG
    document.getElementById('btnSearchSong').onclick = async () => {
      const q = document.getElementById('kwSong').value.trim();
      if (!q) return setOut('Vui lòng nhập tên bài hát');
      try {
        const res = await call('/api/search', { q });
        const songs = Array.isArray(res?.data?.songs) ? res.data.songs.map(pickSongFields) : [];
        if (songs[0]?.encodeId) {
          const inp = document.getElementById('songId');
          if (inp) inp.value = songs[0].encodeId;
        }
        setOut({ loai_tim_kiem: "BÀI HÁT", tong_so: songs.length, danh_sach_bai_hat: songs });
      } catch (e) { setOut(String(e)); }
    };

    // 2. TÌM KIẾM NGHỆ SĨ RIÊNG
    document.getElementById('btnSearchArtist').onclick = async () => {
      const q = document.getElementById('kwArtist').value.trim();
      if (!q) return setOut('Vui lòng nhập tên ca sĩ / nghệ sĩ');
      try {
        const res = await call('/api/search', { q });
        const artists = Array.isArray(res?.data?.artists) ? res.data.artists.map(a => ({
          ten_ca_si: a.name,
          alias: a.alias,
          id: a.id,
          anh_avatar: a.thumbnail,
          luot_theo_doi: a.totalFollow
        })) : [];

        // Tự động điền alias & id xuống khung Artist
        if (artists[0]) {
          const inpAlias = document.getElementById('artistAlias');
          if (inpAlias) inpAlias.value = artists[0].alias;
          const inpId = document.getElementById('artistId');
          if (inpId) inpId.value = artists[0].id;
        }

        setOut({ loai_tim_kiem: "NGHỆ SĨ", tong_so: artists.length, danh_sach_nghe_si: artists });
      } catch (e) { setOut(String(e)); }
    };

    // 3. THAO TÁC THEO SONG ID
    const player = document.getElementById('player');
    const direct128 = document.getElementById('direct128');
    const note128 = document.getElementById('note128');

    document.getElementById('btnPlay').onclick = () => {
      const id = document.getElementById('songId').value.trim();
      if (!id) return alert('Vui lòng nhập Song ID');
      const url = `/api/song/stream?id=${encodeURIComponent(id)}`;
      player.src = url;
      player.classList.remove('hidden');
      player.play();
      direct128.href = url;
      direct128.textContent = url;
      direct128.classList.remove('hidden');
      note128.classList.remove('hidden');
    };

    document.getElementById('btnGetLink').onclick = async () => {
      const id = document.getElementById('songId').value.trim();
      if (!id) return setOut('Vui lòng nhập Song ID');
      try { setOut(await call('/api/song', { id })); } catch (e) { setOut(String(e)); }
    };

    document.getElementById('btnInfoSong').onclick = async () => {
      const id = document.getElementById('songId').value.trim();
      if (!id) return setOut('Vui lòng nhập Song ID');
      try { setOut(await call('/api/info-song', { id })); } catch (e) { setOut(String(e)); }
    };

    document.getElementById('btnLyric').onclick = async () => {
      const id = document.getElementById('songId').value.trim();
      if (!id) return setOut('Vui lòng nhập Song ID');
      try {
        const res = await call('/api/lyric', { id });
        const fileUrl = res?.data?.file;
        if (fileUrl && typeof fileUrl === 'string') {
          try {
            const resp = await fetch(fileUrl);
            const lrc = await resp.text();
            const text = lrc.split('\n').map(l => l.replace(/\s*\[[^\]]*\]\s*/g, '').trim()).filter(Boolean).join('\n');
            setOut(`"file": "${fileUrl}"\n\n${text}`);
          } catch (err) { setOut(res); }
        } else { setOut(res); }
      } catch (e) { setOut(String(e)); }
    };

    // 4. BASIC BUTTONS
    document.getElementById('btnTop100').onclick = async () => {
      try { setOut(await call('/api/top100')); } catch (e) { setOut(String(e)); }
    };
    document.getElementById('btnHome').onclick = async () => {
      try { setOut(await call('/api/home')); } catch (e) { setOut(String(e)); }
    };
    document.getElementById('btnChartHome').onclick = async () => {
      try { setOut(await call('/api/chart-home')); } catch (e) { setOut(String(e)); }
    };
    document.getElementById('btnNewRelease').onclick = async () => {
      try { setOut(await call('/api/newrelease-chart')); } catch (e) { setOut(String(e)); }
    };

    // 5. PLAYLIST
    document.getElementById('btnDetailPlaylist').onclick = async () => {
      const id = document.getElementById('playlistId').value.trim();
      if (!id) return setOut('Vui lòng nhập Playlist ID');
      try { setOut(await call('/api/detail-playlist', { id })); } catch (e) { setOut(String(e)); }
    };

    // 6. ARTIST
    document.getElementById('btnArtist').onclick = async () => {
      const name = document.getElementById('artistAlias').value.trim();
      if (!name) return setOut('Vui lòng nhập Artist alias');
      try { setOut(await call('/api/artist', { name })); } catch (e) { setOut(String(e)); }
    };
    document.getElementById('btnArtistSongs').onclick = async () => {
      const id = document.getElementById('artistId').value.trim();
      const page = document.getElementById('artistPage').value.trim() || '1';
      const count = document.getElementById('artistCount').value.trim() || '15';
      if (!id) return setOut('Vui lòng nhập Artist ID');
      try { setOut(await call('/api/artist-songs', { id, page, count })); } catch (e) { setOut(String(e)); }
    };
  </script>
</body>
</html>
